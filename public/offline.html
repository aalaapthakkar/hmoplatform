<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>You're offline · Your home</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --card: #ffffff;
        --text: #171717;
        --muted: #737373;
        --border: #e5e5e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0a0a;
          --card: #171717;
          --text: #fafafa;
          --muted: #a3a3a3;
          --border: #262626;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      main {
        max-width: 22rem;
        padding: 24px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        text-align: center;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 16px;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 10px 18px;
        border: 0;
        border-radius: 10px;
        background: var(--text);
        color: var(--bg);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>
        We can't reach the internet right now. Check your Wi-Fi or mobile data, then try again. If
        something urgent has gone wrong at home, phone your letting team.
      </p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
